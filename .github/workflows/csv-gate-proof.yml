name: CSV publishing gate proof (isolated)
'on':
  push:
    branches:
    - qa-csv-gate-proof-20261124
permissions: {}
jobs:
  clean:
    name: Clean control / production scan and package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: 465ec6bb0504c2005e9962016aa3916a06db2641
    - name: Validate the release files
      shell: python
      run: |
        import csv, io, json, re, shutil, subprocess, unicodedata
        from pathlib import Path
        def check(name, text):
            width = None
            count = 0
            for n, row in enumerate(csv.reader(io.StringIO(text, newline=""), strict=True), 1):
                if width is None: width = len(row)
                if not width or len(row) != width: raise ValueError(f"{name}: invalid row width at row {n}")
                for col, value in enumerate(row, 1):
                    value = unicodedata.normalize("NFKC", value)
                    if any(unicodedata.category(c) in {"Cc", "Cf"} for c in value) or value.lstrip().startswith(("=", "+", "-", "@")):
                        raise ValueError(f"{name}: unsafe spreadsheet cell at row {n}, column {col}")
                count += 1
            if count < 2: raise ValueError(f"{name}: missing header or data")
            return count - 1
        try: check("self-test", "label\n  =\n")
        except ValueError: pass
        else: raise RuntimeError("Rejection self-test failed")
        out = Path("_verified_site")
        out.mkdir()
        checked = {}
        for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(bytes([0])):
            if not raw: continue
            p = Path(raw.decode())
            if any(part.startswith(".") for part in p.parts): continue
            if p.is_symlink() or not p.is_file(): raise ValueError(f"Unsupported site entry: {p}")
            if p.name == "README.md": continue
            if p.suffix.lower() not in {".html", ".css", ".js", ".csv", ".png", ".jpg", ".jpeg", ".webp", ".ico", ".svg"} and p.name != "CNAME": raise ValueError(f"Review new public file type: {p}")
            if p.suffix.lower() == ".csv": checked[str(p)] = check(str(p), p.read_bytes().decode("utf-8-sig"))
            dest = out / p
            dest.parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(p, dest)
        page = (out / "templates.html").read_text(encoding="utf-8")
        if not (out / "index.html").is_file(): raise ValueError("Missing homepage")
        def dataset(name):
            matches = list(re.finditer(r"\bconst\s+" + name + r"\s*=\s*", page))
            if len(matches) != 1: raise ValueError(f"Expected exactly one {name} dataset")
            return json.JSONDecoder().raw_decode(page[matches[0].end():])[0]
        full, starters = dataset("sampleSets"), dataset("starterCSVs")
        if not {"service-desk", "complaints", "sales"} <= full.keys() or full.keys() != starters.keys(): raise ValueError("Incomplete dashboard sample coverage")
        for key, sample in full.items():
            name = f"{key}-sample.csv (dashboard)"
            checked[name] = check(name, sample)
            starter = starters[key]
            path = starter["file"]
            if path not in checked: raise ValueError(f"Missing starter CSV: {path}")
            check(f"{key} preview", starter["csv"])
            if Path(path).read_text(encoding="utf-8-sig").rstrip("\n") != starter["csv"].rstrip("\n"): raise ValueError(f"Preview differs from {path}")
        for name, count in checked.items(): print(f"PASS: {name}: {count} data rows")
      id: validator
    - name: Package checked site on main pushes only
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
      with:
        path: _verified_site
        name: qa-clean-package
      id: package
  clean_publish:
    name: Clean / publish eligibility (dry run)
    needs: clean
    if: github.event_name == 'push'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Record publish eligibility without deploying
      run: echo "The production publish dependency passed. This read-only proof does not deploy."
  flagged:
    name: Flagged CSV / production scan and package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: 465ec6bb0504c2005e9962016aa3916a06db2641
    - name: Prepare inert marker in the runner only
      shell: python
      run: |-
        import csv
        from pathlib import Path
        p = Path("sales-example.csv")
        with p.open(encoding="utf-8-sig", newline="") as f:
            rows = list(csv.reader(f, strict=True))
        assert rows[0][4] == "product"
        # This standalone marker has no function, destination or executable formula.
        rows[1][4] = "  ="
        with p.open("w", encoding="utf-8", newline="") as f:
            csv.writer(f).writerows(rows)
        print("Runner-only negative control: sales-example.csv, row 2, column 5 (product).")
    - name: Validate the release files
      shell: python
      run: |
        import csv, io, json, re, shutil, subprocess, unicodedata
        from pathlib import Path
        def check(name, text):
            width = None
            count = 0
            for n, row in enumerate(csv.reader(io.StringIO(text, newline=""), strict=True), 1):
                if width is None: width = len(row)
                if not width or len(row) != width: raise ValueError(f"{name}: invalid row width at row {n}")
                for col, value in enumerate(row, 1):
                    value = unicodedata.normalize("NFKC", value)
                    if any(unicodedata.category(c) in {"Cc", "Cf"} for c in value) or value.lstrip().startswith(("=", "+", "-", "@")):
                        raise ValueError(f"{name}: unsafe spreadsheet cell at row {n}, column {col}")
                count += 1
            if count < 2: raise ValueError(f"{name}: missing header or data")
            return count - 1
        try: check("self-test", "label\n  =\n")
        except ValueError: pass
        else: raise RuntimeError("Rejection self-test failed")
        out = Path("_verified_site")
        out.mkdir()
        checked = {}
        for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(bytes([0])):
            if not raw: continue
            p = Path(raw.decode())
            if any(part.startswith(".") for part in p.parts): continue
            if p.is_symlink() or not p.is_file(): raise ValueError(f"Unsupported site entry: {p}")
            if p.name == "README.md": continue
            if p.suffix.lower() not in {".html", ".css", ".js", ".csv", ".png", ".jpg", ".jpeg", ".webp", ".ico", ".svg"} and p.name != "CNAME": raise ValueError(f"Review new public file type: {p}")
            if p.suffix.lower() == ".csv": checked[str(p)] = check(str(p), p.read_bytes().decode("utf-8-sig"))
            dest = out / p
            dest.parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(p, dest)
        page = (out / "templates.html").read_text(encoding="utf-8")
        if not (out / "index.html").is_file(): raise ValueError("Missing homepage")
        def dataset(name):
            matches = list(re.finditer(r"\bconst\s+" + name + r"\s*=\s*", page))
            if len(matches) != 1: raise ValueError(f"Expected exactly one {name} dataset")
            return json.JSONDecoder().raw_decode(page[matches[0].end():])[0]
        full, starters = dataset("sampleSets"), dataset("starterCSVs")
        if not {"service-desk", "complaints", "sales"} <= full.keys() or full.keys() != starters.keys(): raise ValueError("Incomplete dashboard sample coverage")
        for key, sample in full.items():
            name = f"{key}-sample.csv (dashboard)"
            checked[name] = check(name, sample)
            starter = starters[key]
            path = starter["file"]
            if path not in checked: raise ValueError(f"Missing starter CSV: {path}")
            check(f"{key} preview", starter["csv"])
            if Path(path).read_text(encoding="utf-8-sig").rstrip("\n") != starter["csv"].rstrip("\n"): raise ValueError(f"Preview differs from {path}")
        for name, count in checked.items(): print(f"PASS: {name}: {count} data rows")
      id: validator
    - name: Package checked site on main pushes only
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
      with:
        path: _verified_site
        name: qa-flagged-package
      id: package
  flagged_publish:
    name: Flagged / publish eligibility (dry run)
    needs: flagged
    if: github.event_name == 'push'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Record publish eligibility without deploying
      run: echo "The production publish dependency passed. This read-only proof does not deploy."
  verdict:
    name: Confirm expected gate decisions
    needs:
    - clean
    - flagged
    - clean_publish
    - flagged_publish
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Check both paths
      shell: python
      env:
        CLEAN: ${{ needs.clean.result }}
        FLAGGED: ${{ needs.flagged.result }}
        CLEAN_PUBLISH: ${{ needs.clean_publish.result }}
        FLAGGED_PUBLISH: ${{ needs.flagged_publish.result }}
      run: |-
        import os
        expected = {"CLEAN": "success", "CLEAN_PUBLISH": "success", "FLAGGED": "failure", "FLAGGED_PUBLISH": "skipped"}
        actual = {k: os.environ[k] for k in expected}
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
            out.write("### CSV publication gate proof\n\n")
            for k in expected: out.write(f"* {k}: {actual[k]} (expected {expected[k]})\n")
        if actual != expected: raise SystemExit("Unexpected gate decision; inspect the check jobs.")
        print("Control eligible; flagged release blocked.")
